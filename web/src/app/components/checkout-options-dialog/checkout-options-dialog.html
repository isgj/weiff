<h2 mat-dialog-title>Checkout options</h2>

<form (submit)="save(); $event.preventDefault()">
  <mat-dialog-content class="dialog-content-layout">
    <div class="options-layout">
      <div class="option-layout">
        <mat-checkbox [checked]="ignoreImmutable()" (change)="ignoreImmutable.set($event.checked)">
          Ignore immutable
        </mat-checkbox>
        <mat-icon
          class="option-info-layout"
          tabindex="0"
          aria-label="Ignore immutable info"
          matTooltip="Allow checking out immutable revisions, such as revisions pointed to by tags."
        >
          info
        </mat-icon>
      </div>

      <div class="option-layout">
        <mat-checkbox
          [checked]="ignoreWorkingCopy()"
          (change)="ignoreWorkingCopy.set($event.checked)"
        >
          Ignore working copy
        </mat-checkbox>
        <mat-icon
          class="option-info-layout"
          tabindex="0"
          aria-label="Ignore working copy info"
          matTooltip="Do not snapshot or update the working copy. This can leave the working copy stale."
        >
          info
        </mat-icon>
      </div>

      <div class="option-layout">
        <mat-checkbox
          [checked]="noIntegrateOperation()"
          (change)="noIntegrateOperation.set($event.checked)"
        >
          No integrate operation
        </mat-checkbox>
        <mat-icon
          class="option-info-layout"
          tabindex="0"
          aria-label="No integrate operation info"
          matTooltip="Leave the new operation unintegrated. Advanced operation-log usage only."
        >
          info
        </mat-icon>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions-layout">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit">
      <mat-icon>check_circle</mat-icon>
      Checkout
    </button>
  </mat-dialog-actions>
</form>
