<div
  class="connection-status connection-status-layout"
  [matTooltip]="label()"
  [matTooltipDisabled]="!collapsed()"
>
  <span
    class="span-layout"
    [class.is-connected]="connected()"
    [class.is-checking]="checking()"
    [class.has-error]="!connected() && !checking()"
    aria-hidden="true"
  ></span>
  @if (!collapsed()) {
    <span>{{ label() }}</span>
  }
</div>
